<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
        <title>LightHer · Itinéraire</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
        
        <link rel="stylesheet" href="style.css" />
        <style>
            .route-alert {
                display: none;
                margin-bottom: 12px;
                padding: 10px 12px;
                border: 1px solid rgba(239,68,68,.35);
                border-radius: 12px;
                background: rgba(239,68,68,.12);
                color: #fecaca;
                font-size: .78rem;
                line-height: 1.4;
            }

            .route-alert.visible { display: block; }

            .search-help {
                margin-top: -8px;
                margin-bottom: 10px;
                color: var(--text-muted);
                font-size: .78rem;
                line-height: 1.4;
            }

            .search-results {
                display: none;
                margin: -6px 0 12px;
                border: 1px solid var(--border);
                border-radius: 14px;
                overflow: hidden;
                background: var(--bg-card);
                position: relative;
                z-index: 40;
            }

            .search-results.visible { display: block; }

            .search-result {
                width: 100%;
                border: none;
                border-bottom: 1px solid var(--border);
                background: transparent;
                color: var(--text-primary);
                padding: 11px 12px;
                text-align: left;
                font-family: 'DM Sans', sans-serif;
                font-size: .84rem;
                cursor: pointer;
            }

            .search-result:last-child { border-bottom: none; }

            .search-result:hover { background: rgba(217,70,239,.12); }

            .search-empty {
                color: var(--text-muted);
                cursor: default;
            }

            .search-result-title {
                display: block;
                font-weight: 700;
                color: var(--text-primary);
            }

            .search-result-subtitle {
                display: block;
                margin-top: 3px;
                font-size: .72rem;
                color: var(--text-muted);
                line-height: 1.3;
            }

            .user-position-marker {
                position: relative;
                width: 34px;
                height: 34px;
            }

            .user-position-marker .pulse {
                position: absolute;
                inset: 0;
                border-radius: 999px;
                background: rgba(217,70,239,.24);
                animation: userPulse 1.9s ease-out infinite;
            }

            .user-position-marker .dot {
                position: absolute;
                left: 9px;
                top: 9px;
                width: 16px;
                height: 16px;
                border-radius: 999px;
                background: #38bdf8;
                border: 3px solid #ffffff;
                box-shadow: 0 4px 18px rgba(56,189,248,.55);
            }

            @keyframes userPulse {
                from { transform: scale(.55); opacity: .85; }
                to { transform: scale(1.45); opacity: 0; }
            }

            .route-choices {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 14px;
            }

            .route-choice {
                width: 100%;
                text-align: left;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 12px;
                background: var(--bg-input);
                color: var(--text-primary);
                cursor: pointer;
                transition: border-color .2s, box-shadow .2s, transform .15s;
            }

            .route-choice:hover {
                transform: translateY(-1px);
                border-color: var(--pink);
            }

            .route-choice.active {
                border-color: var(--pink);
                box-shadow: 0 0 0 3px var(--pink-glow);
            }

            .choice-title {
                display: block;
                margin-bottom: 6px;
                font-size: .82rem;
                font-weight: 700;
                color: var(--pink-light);
            }

            .choice-meta {
                display: grid;
                gap: 3px;
                font-size: .74rem;
                color: var(--text-muted);
                line-height: 1.35;
            }

            .route-actions {
                display: grid;
                gap: 10px;
            }

            .btn-secondary {
                width: 100%;
                border: 1px solid var(--border);
                border-radius: var(--radius-btn);
                padding: 13px;
                background: transparent;
                color: var(--pink-light);
                font-family: 'DM Sans', sans-serif;
                font-size: .86rem;
                cursor: pointer;
            }

            .route-legend {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 10px;
                color: var(--text-muted);
                font-size: .72rem;
            }

            .route-legend span {
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }

            .route-legend i {
                width: 16px;
                height: 4px;
                border-radius: 999px;
                display: inline-block;
            }

            .guidance-summary {
                display: none;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

            .guidance-summary.visible { display: flex; }

            .guidance-summary strong {
                display: block;
                color: var(--pink-light);
                font-size: .86rem;
                margin-bottom: 3px;
            }

            .guidance-summary span {
                display: block;
                color: var(--text-muted);
                font-size: .75rem;
                line-height: 1.35;
            }

            .guidance-summary .btn-secondary {
                width: auto;
                min-width: 130px;
                padding: 10px 12px;
                border-radius: 12px;
                font-size: .76rem;
            }

            @media (max-width: 480px) {
                .route-alert {
                    margin-bottom: 8px;
                    padding: 8px 10px;
                    font-size: .68rem;
                }

                .search-help {
                    font-size: .68rem;
                    margin-bottom: 8px;
                }

                .search-result {
                    padding: 10px 11px;
                    font-size: .78rem;
                }

                .route-legend {
                    gap: 6px;
                    margin-bottom: 8px;
                    font-size: .65rem;
                }

                .route-choices {
                    grid-template-columns: 1fr;
                    gap: 8px;
                    margin-bottom: 10px;
                }

                .route-choice {
                    border-radius: 12px;
                    padding: 10px;
                }

                .choice-title {
                    margin-bottom: 4px;
                    font-size: .76rem;
                }

                .choice-meta {
                    gap: 2px;
                    font-size: .68rem;
                }

                .route-actions {
                    gap: 8px;
                }

                .btn-secondary,
                #start-guidage {
                    padding: 11px;
                    font-size: .78rem;
                }

                .guidance-summary {
                    align-items: stretch;
                    flex-direction: column;
                    gap: 8px;
                }

                .guidance-summary .btn-secondary {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>

    <div class="page-itineraire">
        
        <div class="search-box">
            <label>Où vas-tu ?</label>
            <input type="text" id="destination" placeholder="Adresse, monument, ville..." />
        </div>
        <p class="search-help">Recherche une adresse, un restaurant, un commerce ou un nom d’établissement. Le trajet est une approximation piétonne pour prototype web.</p>
        <div class="search-results" id="search-results"></div>

        <div id="map-itineraire"></div>

        <div class="info-panel" id="info-panel" style="display: none;">
            <div class="carte-info">
                <div class="guidance-summary" id="guidance-summary">
                    <div>
                        <strong id="guidance-title">Guidage actif</strong>
                        <span id="guidance-meta">Durée estimée à pied : -- · SS --/10</span>
                    </div>
                    <button class="btn-secondary" id="edit-route" type="button">Voir les options</button>
                </div>

                <div id="route-options">
                    <div class="route-alert" id="route-alert"></div>
                    <div class="route-legend">
                        <span><i style="background:#16a34a"></i>Trajet à pied sécurisé</span>
                        <span><i style="background:#475569"></i>Trajet à pied le plus court</span>
                    </div>

                    <div class="route-choices" role="group" aria-label="Choix d'itinéraire">
                        <button class="route-choice active" id="choice-safe" type="button" data-route="safe">
                            <span class="choice-title">Trajet à pied sécurisé</span>
                            <span class="choice-meta">
                                <span>Durée estimée à pied : <b id="time-safe">-- min</b></span>
                                <span>Distance : <span id="distance-safe">-- km</span></span>
                                <span>SS moyen : <span id="score-safe">--/10</span></span>
                                <span>Zones rouges évitées : <span id="avoided-safe">--</span></span>
                            </span>
                        </button>

                        <button class="route-choice" id="choice-direct" type="button" data-route="direct">
                            <span class="choice-title">Trajet à pied le plus court</span>
                            <span class="choice-meta">
                                <span>Durée estimée à pied : <b id="time-direct">-- min</b></span>
                                <span>Distance : <span id="distance-direct">-- km</span></span>
                                <span>SS moyen : <span id="score-direct">--/10</span></span>
                                <span>Zones rouges traversées : <span id="crossed-direct">--</span></span>
                            </span>
                        </button>
                    </div>

                    <div class="route-actions">
                        <button class="btn-principal" id="start-guidage">Lancer le guidage</button>
                        <button class="btn-secondary" id="simulate-incident" type="button">Simuler un incident critique à moins de 200 m</button>
                    </div>
                </div>
            </div>
        </div>

        <nav>
            <a href="index.html">Carte</a>
            <a href="signalement.html">Signaler</a>
            <a href="itineraire.html">Itinéraire</a>
            <a href="sos.html">SOS</a>
            <a href="profil.html">Profil</a>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        onAuthStateChanged(auth, user => {
            if (!user) window.location.href = 'auth.html';
        });

        // Initialisation de la carte sur Paris par défaut
        let map = L.map('map-itineraire', { zoomControl: false }).setView([48.8566, 2.3522], 13);
        let userPos = null;
        let routingControlDirect = null;
        let routingControlSafe = null;
        let currentDestination = null;
        let selectedRoute = 'safe';
        let activeRiskZones = [];
        let virtualRiskZones = [];
        let lastRouteStats = { safe: null, direct: null };
        let guidanceActive = false;
        const riskLayer = L.layerGroup().addTo(map);
        const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
        const MIN_RECENT_RISKS_FOR_DEMO = 2;
        const ROUTE_RISK_RADIUS_M = 220;
        const RECALC_TRIGGER_RADIUS_M = 200;
        const WALKING_SPEED_KMH = 4.8;
        const searchResultsEl = document.getElementById('search-results');
        let searchTimer = null;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 1. Récupérer la position GPS
        navigator.geolocation.getCurrentPosition(pos => {
            userPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
            map.setView(userPos, 15);
            L.marker(userPos, {
                icon: L.divIcon({
                    className: '',
                    html: '<div class="user-position-marker"><span class="pulse"></span><span class="dot"></span></div>',
                    iconSize: [34, 34],
                    iconAnchor: [17, 17]
                })
            }).addTo(map).bindPopup("Vous êtes ici");
        }, () => {
            showToast("Géolocalisation refusée : impossible de calculer le départ automatiquement.", 'error');
        });

        function getSignalementDate(d) {
            const raw = d.createdAt || d.timestamp;
            if (!raw) return null;
            if (typeof raw.toDate === 'function') return raw.toDate();
            if (raw instanceof Date) return raw;
            const date = new Date(raw);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function isRecent(d) {
            const date = getSignalementDate(d);
            if (!date) return false;
            return Date.now() - date.getTime() <= TWO_HOURS_MS;
        }

        function normalizeSignalement(d) {
            const lat = Number(d.lat);
            const lng = Number(d.lng);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
            const ss = Number(d.ss);
            const type = d.typeSignalement || d.type || 'rue_normale';
            return {
                ...d,
                lat,
                lng,
                ss: Number.isFinite(ss) ? ss : 5,
                typeSignalement: type,
                isCritical: ss < 4 || type === 'incident'
            };
        }

        function toXY(point, origin) {
            const lat = point.lat ?? point[0];
            const lng = point.lng ?? point[1];
            const avgLat = ((lat + origin.lat) / 2) * Math.PI / 180;
            return {
                x: (lng - origin.lng) * Math.cos(avgLat) * 111320,
                y: (lat - origin.lat) * 110540
            };
        }

        function fromXY(point, origin) {
            const lat = origin.lat + point.y / 110540;
            const avgLat = ((lat + origin.lat) / 2) * Math.PI / 180;
            const lng = origin.lng + point.x / (Math.cos(avgLat) * 111320);
            return L.latLng(lat, lng);
        }

        function distanceToSegment(point, start, end) {
            const p = toXY(point, start);
            const a = { x: 0, y: 0 };
            const b = toXY(end, start);
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const len2 = dx * dx + dy * dy;
            const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
            const projected = { x: a.x + t * dx, y: a.y + t * dy };
            const distance = Math.hypot(p.x - projected.x, p.y - projected.y);
            return { distance, t };
        }

        function distanceToRoute(point, coords) {
            if (!coords || coords.length < 2) return Infinity;
            let min = Infinity;
            for (let i = 0; i < coords.length - 1; i++) {
                const d = distanceToSegment(point, coords[i], coords[i + 1]).distance;
                if (d < min) min = d;
            }
            return min;
        }

        function buildDetourPoint(zone, start, end) {
            const zonePoint = L.latLng(zone.lat, zone.lng);
            const base = distanceToSegment(zonePoint, start, end);
            const projected = toXY(start, start);
            const endXY = toXY(end, start);
            const dx = endXY.x - projected.x;
            const dy = endXY.y - projected.y;
            const len = Math.hypot(dx, dy) || 1;
            const normal = { x: -dy / len, y: dx / len };
            const zoneXY = toXY(zonePoint, start);
            const side = ((zoneXY.x * normal.x + zoneXY.y * normal.y) >= 0) ? 1 : -1;
            const routePoint = { x: dx * base.t, y: dy * base.t };
            const offset = 380;
            return fromXY({
                x: routePoint.x - normal.x * side * offset,
                y: routePoint.y - normal.y * side * offset
            }, start);
        }

        function formatDistance(meters) {
            if (!Number.isFinite(meters)) return '-- km';
            return (meters / 1000).toFixed(1) + ' km';
        }

        function estimateWalkingMinutes(meters) {
            if (!Number.isFinite(meters) || meters <= 0) return null;
            return Math.max(1, Math.round((meters / 1000) / WALKING_SPEED_KMH * 60));
        }

        function countZonesNearRoute(coords, zones, radius) {
            return zones.filter(zone => distanceToRoute(L.latLng(zone.lat, zone.lng), coords) <= radius).length;
        }

        function estimateRouteSecurity(coords, zones) {
            const crossed = countZonesNearRoute(coords, zones, ROUTE_RISK_RADIUS_M);
            const incidentCount = zones.filter(zone =>
                zone.typeSignalement === 'incident' &&
                distanceToRoute(L.latLng(zone.lat, zone.lng), coords) <= ROUTE_RISK_RADIUS_M
            ).length;
            const score = Math.max(1, Math.min(10, 8.5 - crossed * 1.2 - incidentCount * 1.1));
            return Math.round(score * 10) / 10;
        }

        function buildDemoRiskZone(start, dest) {
            return {
                lat: (start.lat + dest.lat) / 2,
                lng: (start.lng + dest.lng) / 2,
                ss: 2,
                typeSignalement: 'incident',
                isCritical: true,
                timestamp: new Date(),
                demoLocal: true
            };
        }

        async function getRiskZones(start, dest) {
            const allZones = [];
            try {
                const snap = await getDocs(collection(db, "signalements"));
                snap.forEach(doc => {
                    const zone = normalizeSignalement(doc.data());
                    if (zone?.isCritical) allZones.push(zone);
                });
            } catch (error) {
                showToast("Signalements indisponibles, mode démo activé pour le routage.", 'error');
            }

            if (allZones.length === 0) {
                return {
                    zones: [buildDemoRiskZone(start, dest), ...virtualRiskZones],
                    useRecentOnly: false,
                    usingDemoData: true
                };
            }

            const recentZones = allZones.filter(isRecent);
            const useRecentOnly = recentZones.length >= MIN_RECENT_RISKS_FOR_DEMO;
            return {
                zones: [...(useRecentOnly ? recentZones : allZones), ...virtualRiskZones],
                useRecentOnly,
                usingDemoData: false
            };
        }

        function showRouteAlert(message) {
            const alert = document.getElementById('route-alert');
            alert.textContent = message;
            alert.classList.add('visible');
        }

        function setSelectedRoute(route) {
            selectedRoute = route;
            document.querySelectorAll('.route-choice').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.route === route);
            });
            if (guidanceActive) updateGuidanceSummary();
        }

        function updateRouteStats(kind, route, zones, avoidedBySafe = 0) {
            const coords = route.coordinates || [];
            const meters = route.summary.totalDistance;
            const minutes = estimateWalkingMinutes(meters);
            const crossed = countZonesNearRoute(coords, zones, ROUTE_RISK_RADIUS_M);
            const score = estimateRouteSecurity(coords, zones);
            const stats = {
                minutes,
                distance: formatDistance(meters),
                score,
                crossed,
                avoided: Math.max(0, avoidedBySafe)
            };

            lastRouteStats[kind] = stats;

            document.getElementById(`time-${kind}`).innerText = minutes ? minutes + ' min' : '-- min';
            document.getElementById(`distance-${kind}`).innerText = stats.distance;
            document.getElementById(`score-${kind}`).innerText = score + '/10';

            if (kind === 'safe') {
                document.getElementById('avoided-safe').innerText = stats.avoided;
            } else {
                document.getElementById('crossed-direct').innerText = crossed;
            }

            if (guidanceActive && selectedRoute === kind) updateGuidanceSummary();
        }

        function updateGuidanceSummary() {
            const stats = lastRouteStats[selectedRoute];
            const title = selectedRoute === 'safe' ? 'Trajet à pied sécurisé' : 'Trajet à pied le plus court';
            const duration = stats?.minutes ? `${stats.minutes} min` : '-- min';
            const distance = stats?.distance || '-- km';
            const score = stats?.score ? `${stats.score}/10` : '--/10';
            document.getElementById('guidance-title').textContent = title;
            document.getElementById('guidance-meta').textContent = `Durée estimée à pied : ${duration} · ${distance} · SS ${score}`;
        }

        function setGuidanceMode(active) {
            guidanceActive = active;
            const summary = document.getElementById('guidance-summary');
            const options = document.getElementById('route-options');
            summary.classList.toggle('visible', active);
            options.style.display = active ? 'none' : 'block';
            if (active) updateGuidanceSummary();
        }

        function drawRiskZones(zones) {
            riskLayer.clearLayers();
            zones.forEach(zone => {
                L.circle([zone.lat, zone.lng], {
                    color: '#ef4444',
                    fillColor: '#ef4444',
                    fillOpacity: .18,
                    radius: RECALC_TRIGGER_RADIUS_M,
                    weight: 2
                }).addTo(riskLayer).bindPopup(
                    `Zone critique · SS ${zone.ss}/10 · ${zone.typeSignalement === 'incident' ? 'Incident / danger' : 'À éviter'}${zone.demoLocal ? ' · démo locale' : ''}`
                );
            });
        }

        function buildSafeWaypoints(start, dest, zones) {
            const candidates = zones
                .map(zone => ({ zone, ...distanceToSegment(L.latLng(zone.lat, zone.lng), start, dest) }))
                .filter(item => item.distance <= ROUTE_RISK_RADIUS_M * 1.8)
                .sort((a, b) => a.t - b.t)
                .slice(0, 4);

            const detours = candidates.map(item => buildDetourPoint(item.zone, start, dest));
            return {
                waypoints: [start, ...detours, dest],
                avoided: candidates.length
            };
        }

        // 2. Calcul des deux itinéraires
        async function calculerItineraires(destLatLng, options = {}) {
            if (!userPos) return showToast("Position GPS introuvable. Autorise la localisation pour calculer le départ.", 'error');
            currentDestination = destLatLng;
            setGuidanceMode(false);
            lastRouteStats = { safe: null, direct: null };

            // Nettoyage si une recherche a déjà été faite
            if (routingControlDirect) map.removeControl(routingControlDirect);
            if (routingControlSafe) map.removeControl(routingControlSafe);

            // Récupération des zones rouges / incidents, avec filtre 2h et fallback démo
            const riskResult = await getRiskZones(userPos, destLatLng);
            activeRiskZones = riskResult.zones;
            drawRiskZones(activeRiskZones);

            if (options.reason === 'simulation') {
                showRouteAlert("Simulation prototype : incident critique détecté à moins de 200 m. L'itinéraire sûr est recalculé automatiquement.");
            } else {
                showRouteAlert(riskResult.usingDemoData
                    ? "Mode démo : aucune zone critique Firestore disponible, une zone locale est placée sur le trajet pour démontrer l'évitement."
                    : riskResult.useRecentOnly
                    ? "Routage basé sur les signalements critiques des 2 dernières heures."
                    : "Mode démo : données anciennes incluses car il y a trop peu de signalements critiques récents.");
            }

            // --- ITINÉRAIRE DIRECT (Gris) ---
            routingControlDirect = L.Routing.control({
                waypoints: [userPos, destLatLng],
                lineOptions: { styles: [{ color: '#475569', opacity: 0.9, weight: 5 }] },
                addWaypoints: false,
                draggableWaypoints: false,
                createMarker: () => null
            }).addTo(map);

            // --- ITINÉRAIRE SÛR (Rose avec contournement des zones critiques proches du trajet) ---
            const safePlan = buildSafeWaypoints(userPos, destLatLng, activeRiskZones);

            routingControlSafe = L.Routing.control({
                waypoints: safePlan.waypoints,
                lineOptions: { styles: [{ color: '#16a34a', opacity: 1, weight: 7 }] },
                addWaypoints: false,
                createMarker: () => null
            }).addTo(map);

            // Mise à jour de l'interface avec les temps de trajet
            routingControlSafe.on('routesfound', (e) => {
                updateRouteStats('safe', e.routes[0], activeRiskZones, safePlan.avoided);
                document.getElementById('info-panel').style.display = 'block';
            });

            routingControlDirect.on('routesfound', (e) => {
                updateRouteStats('direct', e.routes[0], activeRiskZones);
            });
        }

        function showToast(message, type = '') {
            const toast = document.createElement('div');
            toast.className = `app-toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('visible'));
            setTimeout(() => {
                toast.classList.remove('visible');
                setTimeout(() => toast.remove(), 220);
            }, 3200);
        }

        function compactDisplayName(item) {
            return (item.display_name || '')
                .split(',')
                .map(part => part.trim())
                .filter(part => part && !/^b[aâ]timents?\b/i.test(part) && !/^(a|b)$/i.test(part))
                .slice(0, 4)
                .join(', ');
        }

        function getCity(address = {}) {
            return address.city || address.town || address.village || address.municipality || address.suburb || address.county || '';
        }

        function buildSearchLabel(item) {
            const address = item.address || {};
            const city = getCity(address);
            const postcode = address.postcode ? ` (${address.postcode})` : '';
            const road = address.road || address.pedestrian || address.footway || address.path || address.cycleway || '';
            const houseNumber = address.house_number || '';
            const poi = item.name || address.restaurant || address.cafe || address.bar || address.pub || address.shop || address.amenity || address.leisure || '';

            if (poi && city && !/^(b[aâ]timents?|building)$/i.test(poi)) {
                return `${poi}, ${city}${postcode}`;
            }

            if (road && city) {
                const number = houseNumber ? `${houseNumber} ` : '';
                return `${number}${road}, ${city}${postcode}`;
            }

            if (city && address.postcode) return `${city} (${address.postcode})`;
            return compactDisplayName(item) || item.display_name || 'Résultat sans libellé';
        }

        function buildSearchSubtitle(item, label) {
            const compact = compactDisplayName(item);
            if (!compact || compact === label) return 'France';
            return compact;
        }

        function renderSearchResults(results) {
            searchResultsEl.innerHTML = '';
            if (results.length === 0) {
                searchResultsEl.innerHTML = '<button class="search-result search-empty" type="button">Aucun résultat trouvé en France pour cette recherche.</button>';
                searchResultsEl.classList.add('visible');
                return;
            }

            results.forEach(item => {
                const label = buildSearchLabel(item);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'search-result';
                btn.title = item.display_name || label;
                btn.innerHTML = `<span class="search-result-title"></span><span class="search-result-subtitle"></span>`;
                btn.querySelector('.search-result-title').textContent = label;
                btn.querySelector('.search-result-subtitle').textContent = buildSearchSubtitle(item, label);
                btn.addEventListener('click', () => {
                    document.getElementById('destination').value = label;
                    searchResultsEl.classList.remove('visible');
                    calculerItineraires(L.latLng(Number(item.lat), Number(item.lon)));
                });
                searchResultsEl.appendChild(btn);
            });
            searchResultsEl.classList.add('visible');
        }

        async function rechercherDestination(value) {
            const term = value.trim();
            if (term.length < 3) {
                searchResultsEl.classList.remove('visible');
                return;
            }

            try {
                const params = new URLSearchParams({
                    format: 'json',
                    limit: '8',
                    addressdetails: '1',
                    countrycodes: 'fr',
                    'accept-language': 'fr',
                    q: term
                });

                if (userPos) {
                    const latSpan = 0.8;
                    const lngSpan = 1.1;
                    params.set('viewbox', [
                        userPos.lng - lngSpan,
                        userPos.lat + latSpan,
                        userPos.lng + lngSpan,
                        userPos.lat - latSpan
                    ].join(','));
                    params.set('bounded', '0');
                }

                const resp = await fetch(`https://nominatim.openstreetmap.org/search?${params.toString()}`);
                const data = await resp.json();
                const franceOnly = data.filter(item => !item.address?.country_code || item.address.country_code.toLowerCase() === 'fr');
                renderSearchResults(franceOnly);
                if (franceOnly.length === 0) showToast("Aucun résultat trouvé en France.", 'error');
            } catch (error) {
                showToast("Recherche indisponible. Vérifie la connexion réseau.", 'error');
            }
        }

        // 3. Barre de recherche : suggestions puis choix explicite
        document.getElementById('destination').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => rechercherDestination(e.target.value), 450);
        });

        document.getElementById('destination').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                rechercherDestination(e.target.value);
            }
        });

        document.querySelectorAll('.route-choice').forEach(btn => {
            btn.addEventListener('click', () => setSelectedRoute(btn.dataset.route));
        });

        document.getElementById('start-guidage').addEventListener('click', () => {
            if (!lastRouteStats[selectedRoute]) {
                showToast("Choisis une suggestion puis attends le calcul du trajet.", 'error');
                return;
            }
            const label = selectedRoute === 'safe' ? 'la ligne verte' : 'la ligne gris foncé';
            setGuidanceMode(true);
            showToast(`Guidage prototype lancé. Suivez ${label}.`, 'success');
        });

        document.getElementById('edit-route').addEventListener('click', () => {
            setGuidanceMode(false);
            showToast("Options de trajet affichées.", 'success');
        });

        document.getElementById('simulate-incident').addEventListener('click', () => {
            if (!userPos || !currentDestination) {
                showToast("Calcule d'abord un itinéraire.", 'error');
                return;
            }

            const midpoint = L.latLng(
                (userPos.lat + currentDestination.lat) / 2,
                (userPos.lng + currentDestination.lng) / 2
            );

            virtualRiskZones = [{
                lat: midpoint.lat,
                lng: midpoint.lng,
                ss: 1,
                typeSignalement: 'incident',
                isCritical: true,
                timestamp: new Date()
            }];

            calculerItineraires(currentDestination, { reason: 'simulation' });
        });
    </script>

    </body>
</html>
