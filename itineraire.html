<!DOCTYPE html>
<html lang="fr">
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
        <title>LightHer · Itinéraire</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
            
        <link rel="stylesheet" href="style.css" />
        <script src="https://unpkg.com/h3-js"></script>
        <style>

            .app-toast.success{
                background:linear-gradient(135deg,#D946EF,#A21CAF);
                color:white;
            }

            #locate-btn{
                position:fixed;

                bottom:50px;
                right:30px;

                z-index:9999;

                width:52px;
                height:52px;

                border:none;
                border-radius:50%;

                background:white;
                color:black;

                font-size:22px;

                cursor:pointer;

                box-shadow:0 4px 14px rgba(0,0,0,.35);

                transition:.2s;
            }

            #locate-btn:hover{
                transform:scale(1.08);
            }

            @media (max-width:768px){

                #locate-btn{
                    bottom:50px;
                    right:14px;

                    width:46px;
                    height:46px;

                    font-size:20px;
                }

            }
            .route-alert {
                display: none;
                margin-bottom: 12px;
                padding: 10px 12px;
                border: 1px solid rgba(239,68,68,.35);
                border-radius: 12px;
                background: rgba(239,68,68,.12);
                color: #fecaca;
                font-size: .78rem;
                line-height: 1.4;
            }

            .route-alert.visible { display: block; }

            .search-help {
                margin-top: -8px;
                margin-bottom: 10px;
                color: var(--text-muted);
                font-size: .78rem;
                line-height: 1.4;
            }

            .search-results {
                display: none;
                margin: -6px 0 12px;
                border: 1px solid var(--border);
                border-radius: 14px;
                overflow: hidden;
                background: var(--bg-card);
                position: relative;
                z-index: 40;
            }

            .search-results.visible { display: block; }

            .search-result {
                width: 100%;
                border: none;
                border-bottom: 1px solid var(--border);
                background: transparent;
                color: var(--text-primary);
                padding: 11px 12px;
                text-align: left;
                font-family: 'DM Sans', sans-serif;
                font-size: .84rem;
                cursor: pointer;
            }

            .search-result:last-child { border-bottom: none; }

            .search-result:hover { background: rgba(217,70,239,.12); }

            .search-empty {
                color: var(--text-muted);
                cursor: default;
            }

            .search-result-title {
                display: block;
                font-weight: 700;
                color: var(--text-primary);
            }

            .search-result-subtitle {
                display: block;
                margin-top: 3px;
                font-size: .72rem;
                color: var(--text-muted);
                line-height: 1.3;
            }

            .route-choices {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 14px;
            }

            .route-choice {
                width: 100%;
                text-align: left;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 12px;
                background: var(--bg-input);
                color: var(--text-primary);
                cursor: pointer;
                transition: border-color .2s, box-shadow .2s, transform .15s;
            }

            .route-choice:hover {
                transform: translateY(-1px);
                border-color: var(--pink);
            }

            .route-choice.active {
                border-color: var(--pink);
                box-shadow: 0 0 0 3px var(--pink-glow);
            }

            .choice-title {
                display: block;
                margin-bottom: 6px;
                font-size: .82rem;
                font-weight: 700;
                color: var(--pink-light);
            }

            .choice-meta {
                display: grid;
                gap: 3px;
                font-size: .74rem;
                color: var(--text-muted);
                line-height: 1.35;
            }

            .route-actions {
                display: grid;
                gap: 10px;
            }

            .btn-secondary {
                width: 100%;
                border: 1px solid var(--border);
                border-radius: var(--radius-btn);
                padding: 13px;
                background: transparent;
                color: var(--pink-light);
                font-family: 'DM Sans', sans-serif;
                font-size: .86rem;
                cursor: pointer;
            }

            .route-legend {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 10px;
                color: var(--text-muted);
                font-size: .72rem;
            }

            .route-legend span {
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }

            .route-legend i {
                width: 16px;
                height: 4px;
                border-radius: 999px;
                display: inline-block;
            }

            .panel-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 10px;
            }

            .panel-head strong {
                color: var(--pink-light);
                font-size: .84rem;
            }

            .panel-toggle {
                border: 1px solid var(--border);
                border-radius: 999px;
                background: rgba(217,70,239,.12);
                color: var(--pink-light);
                font-family: 'DM Sans', sans-serif;
                font-size: .78rem;
                line-height: 1;
                cursor: pointer;
            }

            .panel-close {
                width: 32px;
                height: 32px;
            }

            .panel-open {
                display: none;
                position: fixed;
                right: 14px;
                bottom: calc(84px + env(safe-area-inset-bottom));
                z-index: 55;
                padding: 10px 13px;
                box-shadow: 0 12px 28px rgba(0,0,0,.35);
            }

            .panel-open.visible { display: inline-flex; }

            .guidance-summary {
                display: none;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

            .guidance-summary.visible { display: flex; }

            .guidance-summary strong {
                display: block;
                color: var(--pink-light);
                font-size: .86rem;
                margin-bottom: 3px;
            }

            .guidance-summary span {
                display: block;
                color: var(--text-muted);
                font-size: .75rem;
                line-height: 1.35;
            }

            .guidance-summary .btn-secondary {
                width: auto;
                min-width: 130px;
                padding: 10px 12px;
                border-radius: 12px;
                font-size: .76rem;
            }

            @media (max-width: 480px) {
                .route-alert {
                    margin-bottom: 8px;
                    padding: 8px 10px;
                    font-size: .68rem;
                }

                .search-help {
                    font-size: .68rem;
                    margin-bottom: 8px;
                }

                .search-result {
                    padding: 10px 11px;
                    font-size: .78rem;
                }

                .route-legend {
                    gap: 6px;
                    margin-bottom: 8px;
                    font-size: .65rem;
                }

                .route-choices {
                    grid-template-columns: 1fr;
                    gap: 8px;
                    margin-bottom: 10px;
                }

                .route-choice {
                    border-radius: 12px;
                    padding: 10px;
                }

                .choice-title {
                    margin-bottom: 4px;
                    font-size: .76rem;
                }

                .choice-meta {
                    gap: 2px;
                    font-size: .68rem;
                }

                .route-actions {
                    gap: 8px;
                }

                .btn-secondary,
                #start-guidage {
                    padding: 11px;
                    font-size: .78rem;
                }

                .guidance-summary {
                    align-items: stretch;
                    flex-direction: column;
                    gap: 8px;
                }

                .guidance-summary .btn-secondary {
                    width: 100%;
                }
            }
        </style>

    <body>

            <div class="search-box" style="margin-top: 10px;">

            </div>
            <p class="search-help">Recherche une adresse, un restaurant, un commerce ou un nom d’établissement. Le trajet est une approximation piétonne pour prototype web.</p>

                            <button class="panel-toggle panel-close" id="close-route-panel" type="button" aria-label="Réduire les options">×</button>
                        </div>
                        <div class="route-alert" id="route-alert"></div>
                        <div class="route-legend">
                            <span><i style="background:#16a34a"></i>Trajet à pied sécurisé</span>
                            <span><i style="background:#475569"></i>Trajet à pied le plus court</span>
                        </div>

                        <div class="route-choices" role="group" aria-label="Choix d'itinéraire">

                                <span class="choice-title">Trajet à pied sécurisé</span>
                                <span class="choice-meta">
                                    <span>Durée estimée à pied : <b id="time-safe">-- min</b></span>
                                    <span>Distance : <span id="distance-safe">-- km</span></span>

                                </span>

                            <button class="route-choice" id="choice-direct" type="button" data-route="direct">
                                <span class="choice-title">Trajet à pied le plus court</span>
                                <span class="choice-meta">
                                    <span>Durée estimée à pied : <b id="time-direct">-- min</b></span>
                                    <span>Distance : <span id="distance-direct">-- km</span></span>

            </div>

            <nav>
                <a href="index.html">Carte</a>
                <a href="signalement.html">Signaler</a>
                <a href="itineraire.html">Itinéraire</a>
                <a href="sos.html">SOS</a>
                <a href="profil.html">Profil</a>
            </nav>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

        <script type="module">
            import { auth, db } from './firebase-config.js';
            import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
            import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

            onAuthStateChanged(auth, user => {
                if (!user) window.location.href = 'auth.html';
            });

            let map = L.map('map-itineraire', { zoomControl: false }).setView([48.8566, 2.3522], 13);
            let userPos = null;
            let startMarker = null; // Ajouté pour gérer le marqueur personnalisé de départ si l'utilisateur choisit une adresse
            let destinationMarker = null;
            let routingControlDirect = null;
            let routingControlSafe = null;
            let currentDestination = null;
            let currentDepart = null; // Ajouté pour stocker la coordonnée de départ sélectionnée
            let selectedRoute = 'safe';
            let activeRiskZones = [];
            let virtualRiskZones = [];
            let lastRouteStats = { safe: null, direct: null };
            let guidanceActive = false;
            let panelCollapsed = false;

            const riskLayer = L.layerGroup().addTo(map);
            const hexLayer = L.layerGroup().addTo(map);
            const hexagonsMap = new Map();

            const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
            const MIN_RECENT_RISKS_FOR_DEMO = 2;
            const ROUTE_RISK_RADIUS_M = 220;
            const RECALC_TRIGGER_RADIUS_M = 200;
            const WALKING_SPEED_KMH = 4.8;
            const searchResultsEl = document.getElementById('search-results');
            let searchTimer = null;

            // GESTION DYNAMIQUE JOUR / NUIT
            // GESTION JOUR / NUIT SELON LE CHOIX UTILISATEUR
            const modeCarte = localStorage.getItem('modeCarte') || 'jour';

            const tileUrl = modeCarte === 'nuit'
            ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
            : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

            L.tileLayer(tileUrl, {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            }).addTo(map);

            map.whenReady(() => {
                generateHexGrid();
                refreshHexagonColors(activeRiskZones);
            });

            function createUserPositionIcon() {
                return L.divIcon({
                    className: '',
                    html: '<div class="user-position-marker" aria-label="Vous êtes ici"><span class="pulse"></span><span class="dot"></span></div>',
                    iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16]
                });
            }

            function createDestinationIcon() {
                return L.divIcon({
                    className: '',
                    html: '<div class="destination-position-marker" aria-label="Destination"><span class="pulse"></span><span class="dot"></span></div>',
                    iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16]
                });
            }

            // 1. GPS
            let watchId = null;
            let positionInitialized = false;

            watchId = navigator.geolocation.watchPosition(pos => {
                userPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
                if (!currentDepart) {
                    currentDepart = userPos; // Par défaut, le point de départ est la géolocalisation
                    document.getElementById('depart').value = "Ma position actuelle";
                }
                if (!positionInitialized) {
                    positionInitialized = true;
                    map.setView(userPos, 15);
                    L.marker(userPos, { icon: createUserPositionIcon() })
                        .addTo(map)
                        .bindPopup('<span class="marker-popup">Vous êtes ici</span>');
                    generateHexGrid();
                    refreshHexagonColors(activeRiskZones);
                }
            }, err => {
                if (err.code === 1) showToast("Géolocalisation refusée.", 'error');
                else if (err.code === 2) showToast("Position GPS introuvable.", 'error');
                else showToast("Délai de géolocalisation dépassé.", 'error');
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });

            window.addEventListener('beforeunload', () => {
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            });

            // Bouton recentrer
            const locateBtn = document.getElementById("locate-btn");
            if (locateBtn) {
                locateBtn.addEventListener("click", () => {
                    navigator.geolocation.getCurrentPosition(pos => {
                        userPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
                        currentDepart = userPos;
                        document.getElementById('depart').value = "Ma position actuelle";
                        map.flyTo(userPos, 16);
                        showToast("Position recentrée.", "success");
                        if (currentDestination) {
                            calculerItineraires(currentDestination);
                        }
                    }, err => {
                        if (err.code === 1) showToast("Permission refusée. Autorise la localisation dans les réglages.", 'error');
                        else showToast("Impossible d'obtenir votre position.", 'error');
                    }, { enableHighAccuracy: true, timeout: 8000 });
                });
            }

            function getSignalementDate(d) {
                const raw = d.createdAt || d.timestamp;
                if (!raw) return null;
                if (typeof raw.toDate === 'function') return raw.toDate();
                if (raw instanceof Date) return raw;
                const date = new Date(raw);
                return Number.isNaN(date.getTime()) ? null : date;
            }

            function isRecent(d) {
                const date = getSignalementDate(d);
                if (!date) return false;
                return Date.now() - date.getTime() <= TWO_HOURS_MS;
            }

            function normalizeSignalement(d) {
                const lat = Number(d.lat);
                const lng = Number(d.lng);
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
                const ss = Number(d.ss);
                const type = d.typeSignalement || d.type || 'rue_normale';
                return { ...d, lat, lng, ss: Number.isFinite(ss) ? ss : 5, typeSignalement: type, isCritical: ss < 4 || type === 'incident' };
            }

            function toXY(point, origin) {
                const lat = point.lat ?? point[0];
                const lng = point.lng ?? point[1];
                const avgLat = ((lat + origin.lat) / 2) * Math.PI / 180;
                return { x: (lng - origin.lng) * Math.cos(avgLat) * 111320, y: (lat - origin.lat) * 110540 };
            }

            function fromXY(point, origin) {
                const lat = origin.lat + point.y / 110540;
                const avgLat = ((lat + origin.lat) / 2) * Math.PI / 180;
                const lng = origin.lng + point.x / (Math.cos(avgLat) * 111320);
                return L.latLng(lat, lng);
            }

            // Correction ici pour prendre dynamiquement le départ choisi plutôt que de forcer start (qui cassait en mode XY)
            function distanceToSegment(point, startPoint, endPoint) {
                const p = toXY(point, startPoint);
                const a = { x: 0, y: 0 };
                const b = toXY(endPoint, startPoint);
                const dx = b.x - a.x, dy = b.y - a.y;
                const len2 = dx * dx + dy * dy;
                const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
                const projected = { x: a.x + t * dx, y: a.y + t * dy };
                return { distance: Math.hypot(p.x - projected.x, p.y - projected.y), t };
            }

            function distanceToRoute(point, coords) {
                if (!coords || coords.length < 2) return Infinity;
                let min = Infinity;
                for (let i = 0; i < coords.length - 1; i++) {
                    const d = distanceToSegment(point, coords[i], coords[i + 1]).distance;
                    if (d < min) min = d;
                }
                return min;
            }

            function buildDetourPoint(zone, startPoint, endPoint) {
                const zonePoint = L.latLng(zone.lat, zone.lng);
                const base = distanceToSegment(zonePoint, startPoint, endPoint);
                const endXY = toXY(endPoint, startPoint);
                const dx = endXY.x, dy = endXY.y;
                const len = Math.hypot(dx, dy) || 1;
                const normal = { x: -dy / len, y: dx / len };
                const zoneXY = toXY(zonePoint, startPoint);
                const side = (zoneXY.x * normal.x + zoneXY.y * normal.y) >= 0 ? 1 : -1;
                return fromXY({ x: dx * base.t - normal.x * side * 380, y: dy * base.t - normal.y * side * 380 }, startPoint);
            }

            function formatDistance(meters) {
                return Number.isFinite(meters) ? (meters / 1000).toFixed(1) + ' km' : '-- km';
            }

            function estimateWalkingMinutes(meters) {
                if (!Number.isFinite(meters) || meters <= 0) return null;
                return Math.max(1, Math.round((meters / 1000) / WALKING_SPEED_KMH * 60));
            }

            function countZonesNearRoute(coords, zones, radius) {
                return zones.filter(zone => distanceToRoute(L.latLng(zone.lat, zone.lng), coords) <= radius).length;
            }

            function estimateRouteSecurity(coords, zones) {
                const crossed = countZonesNearRoute(coords, zones, ROUTE_RISK_RADIUS_M);
                const incidentCount = zones.filter(zone => zone.typeSignalement === 'incident' && distanceToRoute(L.latLng(zone.lat, zone.lng), coords) <= ROUTE_RISK_RADIUS_M).length;
                return Math.round(Math.max(1, Math.min(10, 8.5 - crossed * 1.2 - incidentCount * 1.1)) * 10) / 10;
            }

            function buildDemoRiskZone(startPoint, dest) {
                return { lat: (startPoint.lat + dest.lat) / 2, lng: (startPoint.lng + dest.lng) / 2, ss: 2, typeSignalement: 'incident', isCritical: true, timestamp: new Date(), demoLocal: true };
            }

            async function getRiskZones(startPoint, dest) {
                const allZones = [];
                try {
                    const snap = await getDocs(collection(db, "signalements"));
                    snap.forEach(doc => { const zone = normalizeSignalement(doc.data()); if (zone?.isCritical) allZones.push(zone); });
                } catch { showToast("Signalements indisponibles, mode démo activé.", 'error'); }
                if (allZones.length === 0) return { zones: [buildDemoRiskZone(startPoint, dest), ...virtualRiskZones], useRecentOnly: false, usingDemoData: true };
                const recentZones = allZones.filter(isRecent);
                const useRecentOnly = recentZones.length >= MIN_RECENT_RISKS_FOR_DEMO;
                return { zones: [...(useRecentOnly ? recentZones : allZones), ...virtualRiskZones], useRecentOnly, usingDemoData: false };
            }

            function showRouteAlert(message) {
                const alert = document.getElementById('route-alert');
                alert.textContent = message;
                alert.classList.add('visible');
            }

            function setSelectedRoute(route) {
                selectedRoute = route;
                document.querySelectorAll('.route-choice').forEach(btn => btn.classList.toggle('active', btn.dataset.route === route));
                applyRouteVisibility();
                if (guidanceActive) updateGuidanceSummary();
            }

            function updateRouteStats(kind, route, zones, avoidedBySafe = 0) {
                const coords = route.coordinates || [];
                const meters = route.summary.totalDistance;
                const minutes = estimateWalkingMinutes(meters);
                const crossed = countZonesNearRoute(coords, zones, ROUTE_RISK_RADIUS_M);
                const score = estimateRouteSecurity(coords, zones);
                const stats = { minutes, distance: formatDistance(meters), score, crossed, avoided: Math.max(0, avoidedBySafe) };
                lastRouteStats[kind] = stats;
                document.getElementById(`time-${kind}`).innerText = minutes ? minutes + ' min' : '-- min';
                document.getElementById(`distance-${kind}`).innerText = stats.distance;
                document.getElementById(`score-${kind}`).innerText = score + '/10';
                if (kind === 'safe') document.getElementById('avoided-safe').innerText = stats.avoided;
                else document.getElementById('crossed-direct').innerText = crossed;
                if (guidanceActive && selectedRoute === kind) updateGuidanceSummary();
            }

            function updateGuidanceSummary() {
                const stats = lastRouteStats[selectedRoute];
                const title = selectedRoute === 'safe' ? 'Trajet à pied sécurisé' : 'Trajet à pied le plus court';
                document.getElementById('guidance-title').textContent = title;
                document.getElementById('guidance-meta').textContent = `Durée estimée à pied : ${stats?.minutes ? stats.minutes + ' min' : '-- min'} · ${stats?.distance || '-- km'} · SS ${stats?.score ? stats.score + '/10' : '--/10'}`;
            }

            function setGuidanceMode(active) {
                guidanceActive = active;
                panelCollapsed = false;
                document.getElementById('guidance-summary').classList.toggle('visible', active);
                document.getElementById('route-options').style.display = active ? 'none' : 'block';
                document.getElementById('info-panel').style.display = 'block';
                document.getElementById('open-route-panel').classList.remove('visible');
                if (active) updateGuidanceSummary();
            }

            function setPanelCollapsed(collapsed) {
                panelCollapsed = collapsed;
                if (!currentDestination) return;
                document.getElementById('info-panel').style.display = collapsed ? 'none' : 'block';
                document.getElementById('open-route-panel').classList.toggle('visible', collapsed);
            }

            function isControlOnMap(control) { return Boolean(control && control._map); }

            function applyRouteVisibility() {
                if (!routingControlDirect || !routingControlSafe) return;
                const active = selectedRoute === 'safe' ? routingControlSafe : routingControlDirect;
                const inactive = selectedRoute === 'safe' ? routingControlDirect : routingControlSafe;
                if (isControlOnMap(inactive)) map.removeControl(inactive);
                if (!isControlOnMap(active)) active.addTo(map);
            }

            function buildSafeWaypoints(startPoint, dest, zones) {
                const candidates = zones
                    .map(zone => ({ zone, ...distanceToSegment(L.latLng(zone.lat, zone.lng), startPoint, dest) }))
                    .filter(item => item.distance <= ROUTE_RISK_RADIUS_M * 1.8)
                    .sort((a, b) => a.t - b.t)
                    .slice(0, 4);
                return { waypoints: [startPoint, ...candidates.map(item => buildDetourPoint(item.zone, startPoint, dest)), dest], avoided: candidates.length };
            }

            // 2. Calcul des itinéraires mis à jour pour exploiter currentDepart
            async function calculerItineraires(destLatLng, options = {}) {
                if (!currentDepart) return showToast("Position de départ introuvable.", 'error');
                currentDestination = destLatLng;
                setGuidanceMode(false);
                lastRouteStats = { safe: null, direct: null };
                panelCollapsed = false;
                document.getElementById('open-route-panel').classList.remove('visible');
                let routesFound = 0;

                if (routingControlDirect) map.removeControl(routingControlDirect);
                if (routingControlSafe) map.removeControl(routingControlSafe);
                if (destinationMarker) map.removeLayer(destinationMarker);
                if (startMarker) map.removeLayer(startMarker);

                // Si le départ n'est pas la position GPS en temps réel, on ajoute un marqueur visuel pour le départ choisi
                if (currentDepart !== userPos) {
                    startMarker = L.marker(currentDepart, { icon: createUserPositionIcon() })
                        .addTo(map).bindPopup('<span class="marker-popup">Départ choisi</span>');
                }

                destinationMarker = L.marker(destLatLng, { icon: createDestinationIcon() })
                    .addTo(map).bindPopup('<span class="marker-popup destination">Arrivée</span>');

                const riskResult = await getRiskZones(currentDepart, destLatLng);
                activeRiskZones = riskResult.zones;
                generateHexGrid();
                refreshHexagonColors(activeRiskZones);

                showRouteAlert(options.reason === 'simulation'
                    ? "Simulation : incident critique détecté à moins de 200 m. L'itinéraire sûr est recalculé."
                    : riskResult.usingDemoData
                        ? "Mode démo : zone locale placée sur le trajet pour démontrer l'évitement."
                        : riskResult.useRecentOnly
                            ? "Routage basé sur les signalements critiques des 2 dernières heures."
                            : "Mode démo : données anciennes incluses (peu de signalements récents).");

                routingControlDirect = L.Routing.control({
                    waypoints: [currentDepart, destLatLng],
                    lineOptions: { styles: [{ color: '#475569', opacity: 0.9, weight: 5 }] },
                    addWaypoints: false, draggableWaypoints: false, createMarker: () => null
                }).addTo(map);

                const safePlan = buildSafeWaypoints(currentDepart, destLatLng, activeRiskZones);
                routingControlSafe = L.Routing.control({
                    waypoints: safePlan.waypoints,
                    lineOptions: { styles: [{ color: '#16a34a', opacity: 1, weight: 7 }] },
                    addWaypoints: false, createMarker: () => null
                }).addTo(map);

                routingControlSafe.on('routesfound', e => {
                    updateRouteStats('safe', e.routes[0], activeRiskZones, safePlan.avoided);
                    document.getElementById('info-panel').style.display = 'block';
                    if (++routesFound >= 2) applyRouteVisibility();
                });
                routingControlDirect.on('routesfound', e => {
                    updateRouteStats('direct', e.routes[0], activeRiskZones);
                    if (++routesFound >= 2) applyRouteVisibility();
                });
            }

            function showToast(message, type = '') {
                const toast = document.createElement('div');
                toast.className = `app-toast ${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('visible'));
                setTimeout(() => { toast.classList.remove('visible'); setTimeout(() => toast.remove(), 220); }, 3200);
            }

            function compactDisplayName(item) {
                return (item.display_name || '').split(',').map(p => p.trim()).filter(p => p && !/^b[aâ]timents?\b/i.test(p) && !/^(a|b)$/i.test(p)).slice(0, 4).join(', ');
            }

            function getCity(address = {}) {
                return address.city || address.town || address.village || address.municipality || address.suburb || address.county || '';
            }

            function buildSearchLabel(item) {
                const address = item.address || {};
                const city = getCity(address);
                const postcode = address.postcode ? ` (${address.postcode})` : '';
                const road = address.road || address.pedestrian || address.footway || address.path || address.cycleway || '';
                const poi = item.name || address.restaurant || address.cafe || address.bar || address.pub || address.shop || address.amenity || address.leisure || '';
                if (poi && city && !/^(b[aâ]timents?|building)$/i.test(poi)) return `${poi}, ${city}${postcode}`;
                if (road && city) return `${address.house_number ? address.house_number + ' ' : ''}${road}, ${city}${postcode}`;
                if (city && address.postcode) return `${city} (${address.postcode})`;
                return compactDisplayName(item) || item.display_name || 'Résultat sans libellé';
            }

            function buildSearchSubtitle(item, label) {
                const compact = compactDisplayName(item);
                return (!compact || compact === label) ? 'France' : compact;
            }

            // Modifié pour savoir quel champ (inputType) reçoit la coordonnée sélectionnée
            function renderSearchResults(results, inputType) {
                searchResultsEl.innerHTML = '';
                if (results.length === 0) {
                    searchResultsEl.innerHTML = '<button class="search-result search-empty" type="button">Aucun résultat trouvé en France.</button>';
                    searchResultsEl.classList.add('visible');
                    return;
                }
                results.forEach(item => {
                    const label = buildSearchLabel(item);
                    const btn = document.createElement('button');
                    btn.type = 'button'; btn.className = 'search-result'; btn.title = item.display_name || label;
                    btn.innerHTML = `<span class="search-result-title"></span><span class="search-result-subtitle"></span>`;
                    btn.querySelector('.search-result-title').textContent = label;
                    btn.querySelector('.search-result-subtitle').textContent = buildSearchSubtitle(item, label);
                    btn.addEventListener('click', () => {
                        document.getElementById(inputType).value = label;
                        searchResultsEl.classList.remove('visible');
                        
                        if (inputType === 'depart') {
                            currentDepart = L.latLng(Number(item.lat), Number(item.lon));
                            if (currentDestination) {
                                calculerItineraires(currentDestination);
                            } else {
                                map.flyTo(currentDepart, 15);
                            }
                        } else {
                            calculerItineraires(L.latLng(Number(item.lat), Number(item.lon)));
                        }
                    });
                    searchResultsEl.appendChild(btn);
                });
                searchResultsEl.classList.add('visible');
            }

            async function rechercherDestination(value, inputType) {
                const term = value.trim();
                if (term.length < 3) { searchResultsEl.classList.remove('visible'); return; }
                try {
                    const params = new URLSearchParams({ format: 'json', limit: '8', addressdetails: '1', countrycodes: 'fr', 'accept-language': 'fr', q: term });
                    if (userPos) {
                        params.set('viewbox', [userPos.lng - 1.1, userPos.lat + 0.8, userPos.lng + 1.1, userPos.lat - 0.8].join(','));
                        params.set('bounded', '0');
                    }
                    const data = await (await fetch(`https://nominatim.openstreetmap.org/search?${params}`)).json();
                    const franceOnly = data.filter(item => !item.address?.country_code || item.address.country_code.toLowerCase() === 'fr');
                    renderSearchResults(franceOnly, inputType);
                    if (franceOnly.length === 0) showToast("Aucun résultat trouvé en France.", 'error');
                } catch { showToast("Recherche indisponible. Vérifie la connexion réseau.", 'error'); }
            }

            // 3. Recherche (Écouteurs adaptés aux deux champs)
            document.getElementById('depart').addEventListener('input', e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => rechercherDestination(e.target.value, 'depart'), 450); });
            document.getElementById('depart').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); rechercherDestination(e.target.value, 'depart'); } });

            document.getElementById('destination').addEventListener('input', e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => rechercherDestination(e.target.value, 'destination'), 450); });
            document.getElementById('destination').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); rechercherDestination(e.target.value, 'destination'); } });

            document.querySelectorAll('.route-choice').forEach(btn => btn.addEventListener('click', () => setSelectedRoute(btn.dataset.route)));
            document.getElementById('start-guidage').addEventListener('click', () => {
                if (!lastRouteStats[selectedRoute]) { showToast("Choisis une suggestion puis attends le calcul du trajet.", 'error'); return; }
                setGuidanceMode(true);
                showToast(`Guidage prototype lancé. Suivez ${selectedRoute === 'safe' ? 'la ligne verte' : 'la ligne gris foncé'}.`, 'success');
            });
            document.getElementById('edit-route').addEventListener('click', () => { setGuidanceMode(false); showToast("Options de trajet affichées.", 'success'); });
            document.getElementById('close-route-panel').addEventListener('click', () => setPanelCollapsed(true));
            document.getElementById('open-route-panel').addEventListener('click', () => setPanelCollapsed(false));
            document.getElementById('simulate-incident').addEventListener('click', () => {
                if (!currentDepart || !currentDestination) { showToast("Calcule d'abord un itinéraire.", 'error'); return; }
                virtualRiskZones = [{ lat: (currentDepart.lat + currentDestination.lat) / 2, lng: (currentDepart.lng + currentDestination.lng) / 2, ss: 1, typeSignalement: 'incident', isCritical: true, timestamp: new Date() }];
                calculerItineraires(currentDestination, { reason: 'simulation' });
            });

            function generateHexGrid() {
                hexLayer.clearLayers();
                hexagonsMap.clear();
                const bounds = map.getBounds();
                const polygon = [[[bounds.getSouth(), bounds.getWest()], [bounds.getSouth(), bounds.getEast()], [bounds.getNorth(), bounds.getEast()], [bounds.getNorth(), bounds.getWest()], [bounds.getSouth(), bounds.getWest()]]];
                h3.polygonToCells(polygon, 9).forEach(h3Index => {
                    const hex = L.polygon(h3.cellToBoundary(h3Index).map(c => [c[0], c[1]]), { color: "transparent", fillColor: "transparent", weight: 0, fillOpacity: 0 });
                    hex.addTo(hexLayer);
                    hexagonsMap.set(h3Index, hex);
                });
            }

            function refreshHexagonColors(zones) {
                hexagonsMap.forEach(hex => hex.setStyle({ color: "transparent", fillColor: "transparent", weight: 0, fillOpacity: 0 }));
                zones.forEach(zone => {
                    const couleur = zone.ss < 4 ? "#ef4444" : zone.ss < 7 ? "#f59e0b" : "#22c55e";
                    const hex = hexagonsMap.get(h3.latLngToCell(zone.lat, zone.lng, 9));
                    if (hex) hex.setStyle({ color: couleur, fillColor: couleur, fillOpacity: 0.45, weight: 2 });
                });
            }

            async function chargerHexagonesInitials() {
                try {
                    const snap = await getDocs(collection(db, "signalements"));
                    const zones = [];
                    snap.forEach(doc => {
                        const zone = normalizeSignalement(doc.data());
                        if (zone) zones.push(zone); 
                    });
                    activeRiskZones = zones;
                    generateHexGrid();
                    refreshHexagonColors(activeRiskZones);
                } catch (error) {
                    console.error(error);
                    generateHexGrid();
                    refreshHexagonColors([]);
                }
            }

            map.on('moveend', () => { generateHexGrid(); refreshHexagonColors(activeRiskZones); });
            chargerHexagonesInitials();
        </script>
    </body>
</html>
