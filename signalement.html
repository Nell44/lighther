<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>LightHer · Signaler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">

    <style>
        .page-signalement {
            position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
            padding: 30px 20px 120px; min-height: 100dvh;
        }
        .header-signalement { text-align: center; margin-bottom: 20px; }
        .header-signalement h1 { font-family: 'Fraunces', serif; font-size: 2.5rem; font-weight: 300; color: white; }
        .header-signalement h1 span { color: var(--pink); }
        .chrono-box { margin-top: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .chrono-box span { font-weight: bold; color: var(--pink-light); }
        .form-container { width: 100%; max-width: 400px; }
        .score-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .slider-group { margin-bottom: 20px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 500; }
        .slider-group label span { color: var(--pink-light); font-weight: bold; }
        .type-group { margin-bottom: 20px; }
        .type-group label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 500; }
        .type-help { margin: -4px 0 10px; font-size: 0.78rem; line-height: 1.4; color: var(--text-muted); }
        #type-signalement { margin-bottom: 0; }
        input[type="range"] { width: 100%; height: 6px; background: var(--bg-input); border-radius: 10px; outline: none; -webkit-appearance: none; margin-top: 10px; border: 1px solid var(--border); }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--pink); cursor: pointer; box-shadow: 0 0 10px var(--pink-glow); }
        #message-succes { display: none; color: var(--vert); text-align: center; font-weight: bold; margin-top: 15px; background: rgba(34, 197, 94, 0.1); padding: 10px; border-radius: var(--radius-card); border: 1px solid var(--vert); }
        #ticket-municipal-preview { display: none; margin: -6px 0 18px; padding: 10px 12px; border-radius: var(--radius-input); border: 1px solid rgba(245,158,11,0.35); background: rgba(245,158,11,0.10); color: var(--orange); font-size: 0.78rem; line-height: 1.45; }
        .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .star { position: absolute; border-radius: 50%; background: var(--pink-light); animation: twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s); }
        @keyframes twinkle { 0%,100% { opacity:.04; transform:scale(1); } 50% { opacity:.40; transform:scale(1.4); } }
    </style>
    
    <script src="https://unpkg.com/h3-js"></script>
</head>
<body>

    <div class="stars" id="stars" aria-hidden="true"></div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        onAuthStateChanged(auth, user => { if (!user) window.location.href = 'auth.html'; });
    </script>

    <main class="page-signalement">
        <header class="header-signalement">
            <h1>Light<span>HER</span></h1>
            <div class="chrono-box">Objectif -30s | Temps : <span id="chrono">0</span>s</div>
        </header>

        <div class="carte-info form-container">
            <div class="score-display">
                <span style="font-size: 0.9rem; font-weight: 500;">Score calculé :</span>
                <span id="badge-score" class="badge-gris">En attente</span>
            </div>

            <div class="type-group">
                <label for="type-signalement">Type de signalement</label>
                <select id="type-signalement">
                    <option value="rue_normale">Rue normale</option>
                    <option value="lampadaire">Lampadaire cassé</option>
                    <option value="obstacle">Obstacle</option>
                    <option value="incident">Incident / danger</option>
                </select>
            </div>
            <div id="ticket-municipal-preview"></div>

            <div class="slider-group">
                <label for="eclairage">Éclairage (35%) <span id="val-eclairage">5/10</span></label>
                <input type="range" id="eclairage" min="0" max="10" value="5">
            </div>
            <div class="slider-group">
                <label for="affluence">Affluence (25%) <span id="val-affluence">5/10</span></label>
                <input type="range" id="affluence" min="0" max="10" value="5">
            </div>
            <div class="slider-group">
                <label for="incidents">Absence d'incidents (30%) <span id="val-incidents">5/10</span></label>
                <input type="range" id="incidents" min="0" max="10" value="5">
            </div>
            <div class="slider-group">
                <label for="sentiment">Sentiment de sécurité (10%) <span id="val-sentiment">5/10</span></label>
                <input type="range" id="sentiment" min="0" max="10" value="5">
            </div>

            <button id="btn-envoyer" class="btn-principal" style="margin-top: 10px;">Envoyer le signalement</button>
            <div id="message-succes">Signalement envoyé ! Merci</div>
        </div>
    </main>

    <nav>
        <a href="index.html">Carte</a>
        <a href="signalement.html" style="background: var(--pink-light); color: var(--bg-deep);">Signaler</a>
        <a href="itineraire.html">Itinéraire</a>
        <a href="sos.html">SOS</a>
        <a href="profil.html">Profil</a>
    </nav>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { calculerSS, getCouleur } from './score.js';
        import { doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // Étoiles de Sélène
        const starsEl = document.getElementById('stars');
        for (let i = 0; i < 30; i++) {
            const s = document.createElement('div'); s.className = 'star'; const size = Math.random() * 2.5 + 1;
            s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--dur:${(Math.random()*3+2).toFixed(1)}s;--delay:${(Math.random()*4).toFixed(1)}s;`;
            starsEl.appendChild(s);
        }

        // Chrono
        let secondes = 0;
        const spanChrono = document.getElementById('chrono');
        const intervalChrono = setInterval(() => { secondes++; spanChrono.textContent = secondes; if (secondes > 30) spanChrono.style.color = "var(--rouge)"; }, 1000);

        // Sliders et calcul score
        const ids = ['eclairage', 'affluence', 'incidents', 'sentiment'];
        const badgeScore = document.getElementById('badge-score');
        const typeSignalementSelect = document.getElementById('type-signalement');
        const ticketMunicipalPreview = document.getElementById('ticket-municipal-preview');

        function getTicketMunicipalSimule(type) {
            if (type === 'lampadaire') return { actif: true, statut: 'transmis', libelle: 'Ticket municipal simulé : lampadaire cassé transmis.' };
            if (type === 'obstacle') return { actif: true, statut: 'en_cours', libelle: 'Ticket municipal simulé : obstacle transmis, traitement en cours.' };
            return { actif: false, statut: null, libelle: '' };
        }

        function mettreAJourTicketMunicipal() {
            const ticket = getTicketMunicipalSimule(typeSignalementSelect.value);
            ticketMunicipalPreview.style.display = ticket.actif ? 'block' : 'none';
            ticketMunicipalPreview.textContent = ticket.libelle || '';
        }

        function mettreAJourScore() {
            const e = parseInt(document.getElementById('eclairage').value);
            const a = parseInt(document.getElementById('affluence').value);
            const i = parseInt(document.getElementById('incidents').value);
            const s = parseInt(document.getElementById('sentiment').value);

            document.getElementById('val-eclairage').textContent = e + '/10';
            document.getElementById('val-affluence').textContent = a + '/10';
            document.getElementById('val-incidents').textContent = i + '/10';
            document.getElementById('val-sentiment').textContent = s + '/10';

            const ss = calculerSS(e, a, i, s);
            const infoCouleur = getCouleur(ss);
            badgeScore.textContent = ss + '/10 - ' + infoCouleur.label;
            badgeScore.style.backgroundColor = infoCouleur.couleur;
        }

        ids.forEach(id => document.getElementById(id).addEventListener('input', mettreAJourScore));
        typeSignalementSelect.addEventListener('change', mettreAJourTicketMunicipal);
        mettreAJourScore(); mettreAJourTicketMunicipal();

        // LOGIQUE : GESTION MOYENNE + SIGNALEMENT À DISTANCE
        document.getElementById('btn-envoyer').addEventListener('click', async () => {
            const btn = document.getElementById('btn-envoyer');
            btn.disabled = true;

            const enregistrerMoyenneFirebase = async (latitude, longitude) => {
                const e = parseInt(document.getElementById('eclairage').value);
                const a = parseInt(document.getElementById('affluence').value);
                const i = parseInt(document.getElementById('incidents').value);
                const s = parseInt(document.getElementById('sentiment').value);
                const typeSignalement = typeSignalementSelect.value;
                const ss = calculerSS(e, a, i, s);
                const ticketMunicipal = getTicketMunicipalSimule(typeSignalement);

                // NOUVEAU : On crée un identifiant unique basé sur l'hexagone exact de la carte
                const zoneId = h3.latLngToCell(latitude, longitude, 9);

                try {
                    // On pointe sur le document de cette zone dans la collection ('signalements')
                    const docRef = doc(db, 'signalements', zoneId);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        // Si la zone existe déjà, on calcule la vraie moyenne mathématique
                        const ancienneData = docSnap.data();
                        const ancienNbVotes = ancienneData.nbVotes || 1;
                        const nouveauNbVotes = ancienNbVotes + 1;
                        
                        let nouvelleMoyenneSS = ((ancienneData.ss * ancienNbVotes) + ss) / nouveauNbVotes;
                        nouvelleMoyenneSS = Math.round(nouvelleMoyenneSS * 10) / 10;

                        await setDoc(docRef, {
                            ss: nouvelleMoyenneSS,
                            nbVotes: nouveauNbVotes,
                            eclairage: Math.round(((ancienneData.eclairage * ancienNbVotes) + e) / nouveauNbVotes),
                            affluence: Math.round(((ancienneData.affluence * ancienNbVotes) + a) / nouveauNbVotes),
                            incidents: Math.round(((ancienneData.incidents * ancienNbVotes) + i) / nouveauNbVotes),
                            sentiment: Math.round(((ancienneData.sentiment * ancienNbVotes) + s) / nouveauNbVotes),
                            timestamp: new Date()
                        }, { merge: true });
                    } else {
                        // Si c'est le tout premier vote dans cette zone, on enregistre les coordonnées exactes
                        await setDoc(docRef, {
                            eclairage: e, affluence: a, incidents: i, sentiment: s,
                            typeSignalement: typeSignalement, ss: ss,
                            lat: latitude, lng: longitude,
                            nbVotes: 1, timestamp: new Date(), createdAt: serverTimestamp()
                        });
                    }

                    clearInterval(intervalChrono);
                    btn.style.display = 'none';
                    document.getElementById('message-succes').style.display = 'block';
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);

                } catch (error) {
                    console.error(error);
                    btn.disabled = false;
                }
            };

            // Vérification Double-clic à distance
            const urlParams = new URLSearchParams(window.location.search);
            const urlLat = parseFloat(urlParams.get('lat'));
            const urlLng = parseFloat(urlParams.get('lng'));

            if (!isNaN(urlLat) && !isNaN(urlLng)) {
                btn.textContent = "Envoi à distance...";
                await enregistrerMoyenneFirebase(urlLat, urlLng);
            } else {
                btn.textContent = "Géolocalisation...";
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => enregistrerMoyenneFirebase(pos.coords.latitude, pos.coords.longitude),
                        () => { btn.disabled = false; }
                    );
                }
            }
        });
    </script>
</body>
</html>
